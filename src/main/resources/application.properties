# Interfaz a usar: console | swing
# Se puede sobrescribir al ejecutar con --ui.type=swing o -Dui.type=swing
ui.type=swing

# Maquina a cargar desde resources/rules (sin la extension .json)
machine.rule=rule_110_trace

# Cantidad maxima de pasos que la interfaz grafica guarda en memoria
gui.max-steps=200000

# Tema de la interfaz grafica: light | dark
gui.theme=light
